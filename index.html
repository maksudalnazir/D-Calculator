<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dowry Calculator</title>
    <style>
        body {
            background-color: black;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border: 2px solid #007bff;
            border-radius: 15px;
            background-color: #000;
        }

        h1 {
            color: #007bff;
            margin-bottom: 30px;
        }

        .question {
            color: white;
            font-size: 1.5rem;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .result-text {
            color: white;
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1.1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background-color: #0056b3;
            transform: scale(1.02);
        }

        input[type="number"] {
            padding: 12px;
            width: 80%;
            border-radius: 5px;
            border: 1px solid #007bff;
            margin-bottom: 20px;
            font-size: 1rem;
            outline: none;
        }

        .page {
            display: none;
        }

        .active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Dowry Calculator</h1>

        <!-- Page 1 -->
        <div id="page1" class="page active">
            <p class="question">Are you a male?</p>
            <button onclick="showPage('page2')">Yes</button>
        </div>

        <!-- Page 2 -->
        <div id="page2" class="page">
            <p class="question">Are you a .....?</p>
            <div class="btn-container">
                <button onclick="showResult('You are not eligible for dowry.')">1) Student</button>
                <button onclick="showPage('pageGovt')">2) Govt Employee</button>
                <button onclick="showPage('pageNonGovt')">3) Non Govt Employee</button>
                <button onclick="showResult('Your Dowry Amount: 75,000')">4) Businessman</button>
                <button onclick="showPage('pageUnemployed')">5) Unemployed</button>
            </div>
        </div>

        <!-- Page: Govt Employee -->
        <div id="pageGovt" class="page">
            <p class="question">Enter your monthly salary:</p>
            <input type="number" id="salaryInput" placeholder="Amount (e.g. 30000)">
            <br>
            <button onclick="calculateGovt()">Calculate</button>
        </div>

        <!-- Page: Non Govt Employee -->
        <div id="pageNonGovt" class="page">
            <p class="question">Do you have your own house, land and a car?</p>
            <div class="btn-container">
                <button onclick="showResult('Your Dowry Amount: 50,000')">Yes</button>
                <button onclick="showResult('Your Dowry Amount: 10,000')">No</button>
            </div>
        </div>

        <!-- Page: Unemployed -->
        <div id="pageUnemployed" class="page">
            <p class="question">
                You don't need to get married and if you are interested then you have to pay the dowry and you have to be GHOR JAMAI.
            </p>
            <button onclick="location.reload()">Start Over</button>
        </div>

        <!-- Result Page -->
        <div id="pageResult" class="page">
            <div id="resultOutput" class="result-text"></div>
            <br><br>
            <button onclick="location.reload()" style="background-color: #444;">Back to Home</button>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            const pages = document.querySelectorAll('.page');
            pages.forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }

        function showResult(text) {
            document.getElementById('resultOutput').innerText = text;
            showPage('pageResult');
        }

        function calculateGovt() {
            const salary = document.getElementById('salaryInput').value;
            if (!salary) {
                alert("Please enter a salary amount.");
                return;
            }
            
            if (parseInt(salary) < 25000) {
                showResult("Your Dowry Amount: 50,000");
            } else {
                showResult("Your Dowry Amount: 1 Lakh 50 thousand");
            }
        }
    </script>
</body>
</html>
